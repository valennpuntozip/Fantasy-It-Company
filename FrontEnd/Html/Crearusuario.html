    <link rel="stylesheet" href="../CSS/style.crearusuario.css" />
</head>

<body>
    <aside class="sidebar">
        <a href="botones.html"><img src="../Assets/img/logo.png" alt="Hospital de Clínicas" /></a>
        <nav>
            <div class="nav-group" id="nav-formularios">
                <div class="nav-group__header">
                    <button type="button" class="nav-group__toggle" aria-expanded="false"
                        aria-controls="submenu-formularios">
                        <span class="arrow" aria-hidden="true">&#9654;</span>
                    </button>
                    <a href="Vehiculos.html" class="nav-group__label">Formularios</a>
                </div>
                <div class="nav-group__submenu" id="submenu-formularios">
                    <a href="Translado.html">Solicitud de traslado</a>
                </div>
            </div>
            <a href="#">Reportes</a>
            <a href="panelAD.html">Panel administrativo</a>
            <div class="nav-group is-open" id="nav-usuarios">
                <div class="nav-group__header">
                    <button type="button" class="nav-group__toggle" aria-expanded="true"
                        aria-controls="submenu-usuarios">
                        <span class="arrow" aria-hidden="true">&#9654;</span>
                    </button>
                    <a href="usGest.html" class="nav-group__label">Gestión de usuarios</a>
                </div>
                <div class="nav-group__submenu" id="submenu-usuarios">
                    <a href="Crearusuario.html" class="active">Crear usuario</a>
                </div>
            </div>
        </nav>
    </aside>

    <div class="page">
        <header class="page-header">
            <h1>Creación de Usuario Administrativo</h1>
        </header>

        <section class="page-content">
            <div class="form-card">
                <h2>Ingrese los datos</h2>

                <form id="form-crear-usuario" method="post">
                    <div class="form-group">
                        <label for="cedula">Cédula</label>
                        <input type="text" id="cedula" name="cedula" placeholder="1234567" required />
                    </div>

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required />
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" required />
                    </div>

                    <div class="form-group">
                        <label for="repetir">Repetir contraseña</label>
                        <input type="password" id="repetir" name="repetir" required />
                    </div>

                    <p id="form-mensaje" class="form-mensaje" hidden></p>

                    <button type="submit" class="btn-submit">Crear usuario</button>
                </form>
            </div>
        </section>
    </div>

    <script src="../JS/menuDesple.js"></script>

    <script>


        var form = document.getElementById('form-crear-usuario');
        var mensaje = document.getElementById('form-mensaje');
        var apiUrl = '../../API/Usuarios/Usuarios.php';

        function mostrarMensaje(texto, ok) {
            mensaje.hidden = false;
            mensaje.textContent = texto;
            mensaje.style.color = ok ? '#166534' : '#b91c1c';
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            var cedula = document.getElementById('cedula').value.trim();
            var nombre = document.getElementById('nombre').value.trim();
            var contrasena = document.getElementById('contrasena').value;
            var repetir = document.getElementById('repetir').value;

            if (!cedula || !nombre || !contrasena) {
                mostrarMensaje('Completá cédula, nombre y contraseña.', false);
                return;
            }

            if (contrasena !== repetir) {
                mostrarMensaje('Las contraseñas no coinciden.', false);
                return;
            }

            try {
                var response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cedula: cedula,
                        nombre: nombre,
                        contrasena: contrasena,
                        repetir: repetir
                    })
                });

                var data = await response.json();

                if (!response.ok || !data.ok) {
                    mostrarMensaje(data.mensaje || 'No se pudo crear el usuario.', false);
                    return;
                }

                mostrarMensaje(data.mensaje || 'Usuario creado correctamente.', true);
                form.reset();
            } catch (error) {
                mostrarMensaje('Error al conectar con el servidor. Revisá que PHP y MySQL estén activos.', false);
            }
        });
    </script>
</body>

</html>
