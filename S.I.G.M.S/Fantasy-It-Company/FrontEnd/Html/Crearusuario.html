<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de Usuario Administrativo</title>
    <link rel="stylesheet" href="../CSS/style.crearusuario.css" />
</head>

<body>
    <aside class="sidebar">
        <a href="botones.html"><img src="../Assets/img/logo.png" alt="Hospital de Clínicas" /></a>
        <nav>
            <div class="nav-group" id="nav-formularios">
                <div class="nav-group__header">
                    <button type="button" class="nav-group__toggle" aria-expanded="false"
                        aria-controls="submenu-formularios">
                        <span class="arrow" aria-hidden="true">&#9654;</span>
                    </button>
                    <a href="Vehiculos.html" class="nav-group__label">Formularios</a>
                </div>
                <div class="nav-group__submenu" id="submenu-formularios">
                    <a href="Translado.html">Solicitud de traslado</a>
                </div>
            </div>
            <a href="reporte.html">Reportes</a>
            <a href="panelAD.html">Panel administrativo</a>
            <div class="nav-group is-open" id="nav-usuarios">
                <div class="nav-group__header">
                    <button type="button" class="nav-group__toggle" aria-expanded="true"
                        aria-controls="submenu-usuarios">
                        <span class="arrow" aria-hidden="true">&#9654;</span>
                    </button>
                    <a href="usGest.html" class="nav-group__label">Gestión de usuarios</a>
                </div>
                <div class="nav-group__submenu" id="submenu-usuarios">
                    <a href="Crearusuario.html" class="active">Crear usuario</a>
                </div>
            </div>
        </nav>
        <div class="user-menu user-menu--bottom" id="user-menu">
            <span class="user-menu__name" id="user-menu-name">Usuario</span>
            <button type="button" class="user-menu__toggle" id="user-menu-toggle" aria-haspopup="true"
                aria-expanded="false">&#8942;</button>
            <div class="user-menu__dropdown" id="user-menu-dropdown">
                <button type="button" class="user-menu__logout" id="btn-logout">Cerrar sesión</button>
            </div>
        </div>
    </aside>

    <div class="page">
        <header class="page-header">
            <h1>Creación de Usuario Administrativo</h1>
        </header>

        <section class="page-content">
            <div class="form-card">
                <h2>Ingrese los datos</h2>

                <form id="form-crear-usuario" method="post">
                    <div class="form-group">
                        <label for="cedula">Cédula</label>
                        <input type="text" id="cedula" name="cedula" placeholder="1234567" required />
                    </div>

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required />
                    </div>

                    <div class="form-group">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" required />
                    </div>

                    <div class="form-group">
                        <label for="repetir">Repetir contraseña</label>
                        <input type="password" id="repetir" name="repetir" required />
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol</label>
                        <select id="rol" name="rol">
                            <option value="Operador" selected>Operador</option>
                            <option value="Supervisor">Supervisor</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>

                    <p id="form-mensaje" class="form-mensaje" hidden></p>

                    <button type="submit" class="btn-submit">Crear usuario</button>
                </form>
            </div>
        </section>
    </div>
    <script src="../JS/session.js"></script>
    <script src="../JS/menuDesple.js"></script>
    <script src="../JS/validaciones.js"></script>
    <script src="../JS/crearusuario.js"></script>
</body>

</html>
